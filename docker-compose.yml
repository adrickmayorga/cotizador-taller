services:
  app:
    build: .
    container_name: cotizador_app
    restart: unless-stopped
    ports:
      - "8086:80"
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=srnu_cotizador
      - DB_USER=cotizador_user
      - DB_PASS=cotizador_pass_2026
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: cotizador_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_cotizador_secure
      MYSQL_DATABASE: srnu_cotizador
      MYSQL_USER: cotizador_user
      MYSQL_PASSWORD: cotizador_pass_2026
    volumes:
      - cotizador_mariadb_data:/var/lib/mysql
      - ./srnu_cotizador.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -proot_cotizador_secure || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: cotizador_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      - db

volumes:
  cotizador_mariadb_data:
